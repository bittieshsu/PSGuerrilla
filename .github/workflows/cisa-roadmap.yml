name: CISA / SCuBA Roadmap

# Daily deterministic scan of CISA SCuBA baselines (ScubaGear, ScubaGoggles) plus
# broader CISA context (KEV catalog, BOD 25-01), diffed against Guerrilla's shipped
# checks into docs/roadmap/cisa-scuba-roadmap.md and committed back to main.
# No AI, no external packages, no secrets: Python standard library only.
# Free on this public repo (unlimited Actions minutes).

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC daily (about 07:00-08:00 US Eastern)
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: cisa-roadmap
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deterministic CISA/SCuBA scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/roadmap/cisa-scan.py

      - name: Commit roadmap if changed
        run: |
          git config user.name  "Jim Tyler"
          git config user.email "jaratyweb@gmail.com"
          git add docs/roadmap/
          if git diff --cached --quiet; then
            echo "No roadmap changes to commit."
            exit 0
          fi
          git commit -m "chore(roadmap): daily CISA/SCuBA scan $(date -u +%Y-%m-%d) [skip ci]"
          git push origin HEAD:main
